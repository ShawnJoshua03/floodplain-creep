[project]
name = "floodplain-creep"
version = "0.1.0"
description = "Neighborhood-level view of new buildings in modeled flood zones."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "vulture",
    "deptry",
    "types-pyyaml>=6.0.12.20261103",
    "types-shapely>=2.1.0.20261030",
    "types-geopandas>=1.2.0.20261107",
    "pandas-stubs>=3.1.0.261029",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "ARG", "BLE", "ERA", "C90", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 40

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "scripts"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]

[tool.deptry]
extend_exclude = ["web", "data"]
known_first_party = ["extra_rules", "check_repo_rules"]

[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*"]
ignore_missing_imports = true
